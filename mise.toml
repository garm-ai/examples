# Toolchain and tasks for examples. Task names match every other garm-ai
# repository.
[tools]
go = "1.26"
buf = "1"

[tasks.gen]
description = "Regenerate Go from the protos"
dir = "calculator"
run = "buf generate"

[tasks.catalogue]
description = "Build the calculator catalogue"
dir = "calculator"
run = "garm catalogue build -o calculator.binpb --source garm-ai/examples/calculator"

[tasks.serve]
description = "Run calcd against a local NATS"
run = "go run ./calculator/cmd/calcd"

[tasks.build]
run = "go build ./..."

[tasks.test]
description = "Run the tests, including the end-to-end one over an embedded NATS"
# -timeout because Go's default is ten minutes, and a test waiting on a
# service that never answers will sit there for all of it. A CI job that
# hangs before failing is one nobody waits for.
run = "go test ./... -race -count=1 -timeout 120s"

[tasks.lint]
run = "go vet ./..."

[tasks.fmt]
run = "go fmt ./..."

[tasks.ci]
depends = ["lint", "build", "test"]
