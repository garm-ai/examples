# Toolchain and tasks for examples. Task names match every other garm-ai
# repository.
[tools]
go = "1.26"
buf = "1"

[tasks."vendor-annotations"]
description = "Refresh the vendored garm annotations from the pinned garm module"
dir = "bank"
# NOT `garm init --force`: init also writes buf.yaml and buf.gen.yaml, and
# this tree's copies are customised (a protovalidate dependency, a real
# contract_version). It would overwrite both to scaffold defaults.
#
# The module cache is the source of truth because it is the same bytes the Go
# build uses, so a mismatch between the vendored .proto and the linked
# contracts package is impossible by construction. Cache files are 0444; the
# chmod is on the copy, never on the cache.
run = """
set -e
VERSION=v0.14.0
go mod download github.com/garm-ai/garm@$VERSION
SRC="$(go env GOMODCACHE)/github.com/garm-ai/garm@$VERSION/proto/garm"
for f in tool/v1/tool.proto agent/v1/agent.proto; do
  mkdir -p "third_party/proto/garm/$(dirname "$f")"
  cp "$SRC/$f" "third_party/proto/garm/$f"
  chmod u+w "third_party/proto/garm/$f"
done
echo "vendored garm/tool/v1/tool.proto and garm/agent/v1/agent.proto from garm $VERSION"
"""

[tasks.plugin]
description = "Install the tool generator at the pinned version"
# Pinned, not @latest: the generated binding carries a descriptor hash, and a
# generator that moved under you changes committed output for no reason
# anyone asked for.
run = "go install github.com/garm-ai/garm/cmd/protoc-gen-garm-go@v0.14.0"

[tasks.gen]
description = "Regenerate Go from the protos"
depends = ["plugin"]
run = ["mise run gen-calculator", "mise run gen-bank"]

[tasks.gen-calculator]
dir = "calculator"
depends = ["plugin"]
run = "buf generate"

[tasks.gen-bank]
dir = "bank"
depends = ["plugin"]
run = "buf generate"

[tasks.cli]
description = "Install the garm CLI at the pinned version"
# Pinned for the same reason the plugin is: the digest identifies the
# catalogue, so it must not move because someone upgraded a CLI on a laptop.
#
# v0.14.0 is the first tag carrying `claims check`, the garm.agent.v1
# annotation, lint A1-A5 and `catalogue publish`, so the separate claims-cli
# install that existed while those were untagged is gone.
run = "go install github.com/garm-ai/garm/cmd/garm@v0.14.0"

[tasks.daemon]
description = "Install garmd at the pinned version, for the mount check"
# bump to v0.2.0 when Track A tags
run = "go install github.com/garm-ai/garmd/cmd/garmd@v0.1.0"

[tasks."check-bank"]
description = "Assert the bank catalogue mounts where it should and refuses where it should not"
dir = "bank"
depends = ["catalogue-bank", "daemon"]
# Three runs, and the two failing ones are the point.
#
# Asserting only that the catalogue mounts somewhere would pass just as well if
# a refusal had quietly stopped working — and a refusal that stopped working is
# a payment tool served with no grant or no audit trail, which is the one
# outcome this whole system exists to prevent.
#
# initiate_payment declares BOTH MODE_GRANT and audit LEVEL_AUDIT with
# fail_closed and retain_days 2555. Each is independently sufficient to refuse,
# so each is asserted on its own: a deployment with neither, and a deployment
# with grants but no audit sink. Only the third, equipped both ways, may mount.
#
# 61320h is 2555 days. A sink keeping less is refused too, which is the check
# that catches a misconfigured bucket rather than a missing one.
run = """
set -e
if garmd check --catalogue bank.binpb > /dev/null 2>&1; then
  echo "FAIL: the catalogue mounted on a deployment with no grant verifier and" >&2
  echo "      no audit sink. initiate_payment declares both. The refusal has" >&2
  echo "      stopped working, which means an irreversible payment would be" >&2
  echo "      served ungated while its schema says it is supervised." >&2
  exit 1
fi
echo "ok: refused on a bare deployment, as it must"

if garmd check --catalogue bank.binpb --with-grants > /dev/null 2>&1; then
  echo "FAIL: the catalogue mounted on a deployment with a grant verifier but" >&2
  echo "      NO audit sink. initiate_payment declares audit.fail_closed with" >&2
  echo "      2555 days of retention: the money must not move unless the record" >&2
  echo "      of it is already durable. A grant alone does not buy that." >&2
  exit 1
fi
echo "ok: refused with grants but no audit sink, as it must"

garmd check --catalogue bank.binpb --with-grants --audit-retention 61320h
"""

[tasks."diff-bank"]
description = "Report how this branch moves the bank's policy, against a base ref"
dir = "bank"
depends = ["cli"]
# BASE defaults to main. In CI it is the pull request's base, so the report is
# "what does merging this change", which is the only framing a reviewer can act
# on — a diff against an arbitrary commit is noise.
#
# Not gated with --fail-on-widening here. A widening is frequently correct and
# blocking every one of them teaches people to route around the check; what it
# must never be is INVISIBLE. In a bank this is where you would add the gate,
# with an override a named human applies.
run = """
set -e
BASE="${BASE:-main}"
WORK=$(mktemp -d)
trap 'rm -rf "$WORK"' EXIT

# The base catalogue is built from a clean worktree of the base ref rather
# than from a stash: a stash leaves generated output and build artifacts
# behind, and the digest would then depend on what happened to be lying around.
git worktree add --detach --quiet "$WORK/base" "$BASE"
garm catalogue build --proto "$WORK/base/bank/proto" -o "$WORK/base.binpb"
git worktree remove --force "$WORK/base"

garm catalogue build --proto proto -o "$WORK/head.binpb"
garm catalogue diff "$WORK/base.binpb" "$WORK/head.binpb"
"""

[tasks.lint-bank]
description = "Lint the bank tool declarations"
dir = "bank"
depends = ["cli"]
run = "garm lint --proto proto"

[tasks.catalogue-bank]
description = "Build the bank catalogue"
dir = "bank"
depends = ["cli"]
run = "garm catalogue build --proto proto -o bank.binpb --source garm-ai/examples/bank"

[tasks."claims-check-bank"]
description = "Assert the bank claims policies only reference compartments and tool sets the catalogue declares"
dir = "bank"
depends = ["catalogue-bank", "cli"]
# catalogue-bank BUILDS bank.binpb every run rather than trusting whatever is
# on disk — bank.binpb is gitignored and generated, and a stale copy would
# make this gate authoritative about the wrong vocabulary.
run = """
set -e
garm claims check auth/claims.yaml   --against bank.binpb
garm claims check auth/personas.yaml --against bank.binpb
"""

[tasks."gen-check"]
description = "Fail if the committed generated code is stale"
# Generated code is COMMITTED here, because a Go module has to build from its
# own source: anyone cloning this to fork it runs `go build`, not buf plus
# three plugins. The cost of committing is drift, and this is the check that
# pays it.
#
# Scoped to the generated paths, so an unrelated edit in the working tree does
# not fail it — a check that cries wolf locally is one people stop running.
run = """
mise run gen
if ! git diff --quiet -- calculator/gen bank/gen; then
  echo "generated code is stale — run 'mise run gen' and commit:" >&2
  git diff --stat -- calculator/gen bank/gen >&2
  exit 1
fi
"""

[tasks.catalogue]
description = "Build the calculator catalogue"
dir = "calculator"
depends = ["cli"]
run = "garm catalogue build -o calculator.binpb --source garm-ai/examples/calculator"

[tasks.serve]
description = "Run calcd against a local NATS"
run = "go run ./calculator/cmd/calcd"

[tasks.build]
run = "go build ./..."

[tasks.test]
# The bank's projection test runs the real garm and garmd binaries rather than
# importing them, because examples must not depend on garmd — the boundary CI
# asserts. It refuses rather than skips when they are absent, so the task that
# runs it installs them.
depends = ["cli", "daemon"]
description = "Run the tests, including the end-to-end one over an embedded NATS"
# -timeout because Go's default is ten minutes, and a test waiting on a
# service that never answers will sit there for all of it. A CI job that
# hangs before failing is one nobody waits for.
run = "go test ./... -race -count=1 -timeout 120s"

[tasks.lint]
run = "go vet ./..."

[tasks.fmt]
run = "go fmt ./..."

[tasks.ci]
depends = ["lint", "lint-bank", "check-bank", "claims-check-bank", "build", "test", "gen-check"]
