# Personas for the dev identity provider.
#
# A FILE, not a store, and deliberately so: everything here is configuration
# that a pull request can argue about, the way bank's proto annotations are.
# There is no create/update/delete endpoint, because a dev IdP with a CRUD API
# starts to look like a product, and the next step after that is someone
# pointing a staging environment at it.
#
#   garmdev idp --personas examples/bank/auth/personas.yaml
#   curl -s '127.0.0.1:7450/token?user=jdoe'
#   curl -s '127.0.0.1:7450/token?user=jdoe&as=support-assistant'   # delegated
#
# Same role NAMES as claims.yaml on purpose, so the two files read side by
# side: this is the dev-mode stand-in for tuples.yaml plus claims.yaml, not an
# approximation of a different policy.

# Every persona in this file belongs to the bank, and every token minted from
# it says so. The STS refuses to exchange a subject token whose tenant is
# empty — confinement depends on the value flowing from a verified token — so
# without this line both doors fail at the exchange with an access_denied that
# says nothing about tenants. `garmdev idp --tenant` overrides it; a persona's
# own `tenant:` overrides both. See devkit's README.
tenant: bank

# A role is a BUNDLE of claims, and bundling is an identity provider's job.
# garm never sees a role — it receives the clearance, compartments and verbs a
# role expands to.
roles:
  support-desk:
    # `internet` and `research`: the adopted web.v1.fetch_page tool, for the
    # research-assistant agent. Same bundle as claims.yaml's support-desk,
    # and it has to stay that way: this file is the dev-mode stand-in for
    # what claims.yaml computes from a real STS exchange.
    clearance: INTERNAL
    compartments: [pii-contact, financial, internet]
    verbs: [READ]
    tool_sets: [support, research]

  card-support:
    clearance: CONFIDENTIAL
    compartments: [card-data]
    verbs: [READ, WRITE]
    tool_sets: [support]

  fraud-analyst:
    clearance: CONFIDENTIAL
    compartments: [financial, pii-contact, pii-identity]
    verbs: [READ]
    tool_sets: [support, compliance]

  compliance-officer:
    clearance: CONFIDENTIAL
    compartments: [kyc]
    verbs: [READ]
    tool_sets: [compliance]

  compliance-contact:
    clearance: INTERNAL
    compartments: [pii-contact]
    verbs: [READ]
    tool_sets: [compliance]

  payments-ops:
    clearance: RESTRICTED
    compartments: [financial]
    verbs: [READ, DESTRUCTIVE]
    tool_sets: [payments]

  retail-customer:
    clearance: INTERNAL
    compartments: [financial, pii-contact]
    verbs: [READ]

users:
  # `subject` is what lands in `sub` and therefore in every ledger row. Real
  # identity providers emit opaque subjects, and a dev tool that hid that
  # would teach people to key dashboards on names.
  jdoe:
    subject: "employee:jdoe"
    # Three roles, and the third is the one the agent demo turns on.
    #
    # The fold intersects, so an assistant acting for jdoe reaches
    # initiate_payment only if jdoe reaches it too. A support agent who could
    # not move money themselves and whose assistant could would be the
    # confused deputy this system exists to prevent, so jdoe holds
    # payments-ops outright — a payments clerk who also works the phones.
    #
    # What stops jdoe simply paying without asking anybody is not this file:
    # it is initiate_payment's MODE_GRANT and approver predicate, and spec
    # §3.5's exclusion of the run's own subject, which is what makes this
    # four-eyes rather than a formality. jdoe qualifies for that predicate
    # arithmetically and is refused anyway; see bank/auth_test.go.
    roles: [support-desk, card-support, payments-ops]

  amir:
    subject: "employee:amir"
    roles: [fraud-analyst]

  priya:
    subject: "employee:priya"
    # Two roles, the second for the compliance-screen agent: it calls
    # get_customer, which needs pii-contact, and the fold intersects — an
    # agent that could identify a customer for an officer who could not
    # would reach further than the human it acts for. Same pair as
    # claims.yaml's compliance-team segment.
    roles: [compliance-officer, compliance-contact]

  sam:
    subject: "employee:sam"
    roles: [payments-ops]

  # The customer behind bank's own fixture data (data.go's cust_ab12cd), so a
  # token minted for her and a call against the running bank line up.
  ada:
    subject: "customer:cust_ab12cd"
    roles: [retail-customer]

agents:
  # may_act_for is enforced when MINTING, and garm never sees it. garm folds a
  # delegation chain it is given and can only narrow it. Try
  # `?user=amir&as=support-assistant` and watch it refuse: amir is not in
  # may_act_for below.
  #
  # Same two roles as claims.yaml's agents: block, and for the same reason:
  # this file is the dev-mode stand-in for what claims.yaml computes from a
  # real STS exchange, so a role list that drifted from claims.yaml would mean
  # the devkit path and the governed path grant the assistant different
  # authority for the same identity — exactly the disagreement auth/README.md
  # says these two files must not have.
  support-assistant:
    subject: "agent:support-assistant"
    roles: [support-desk, payments-ops]
    may_act_for: [jdoe]

  # Same role lists as claims.yaml's agents: block, for the reason the
  # assistant's comment gives. may_act_for mirrors tuples.yaml's can_invoke:
  # one persona per agent.
  card-guardian:
    subject: "agent:card-guardian"
    roles: [support-desk, card-support]
    may_act_for: [jdoe]

  concierge:
    subject: "agent:concierge"
    roles: [retail-customer]
    may_act_for: [ada]

  compliance-screen:
    subject: "agent:compliance-screen"
    roles: [compliance-officer, compliance-contact]
    may_act_for: [priya]

  research-assistant:
    subject: "agent:research-assistant"
    roles: [support-desk]
    may_act_for: [jdoe]
