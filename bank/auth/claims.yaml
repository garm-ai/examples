# The claims policy: definitions and rules only. OpenFGA (auth/tuples.yaml in
# a static build, or a live store) holds who is actually a member of which
# segment — that assignment cannot live here; there are potentially millions
# of customers. See auth/README.md.
#
# The compartments and tool sets below are named exactly as bank/v1/taxonomy.proto
# declares them — that is the whole point of this file sitting beside proto/
# rather than off in some other repository. `garm claims check` is the gate
# that keeps the two from drifting; run it after any edit here:
#
#   garm claims check auth/claims.yaml --against bank.binpb

# A role is a bundle of claims. Same meaning as personas.yaml's roles: block.
# Clearance is written in the bare spelling (INTERNAL, not CLEARANCE_INTERNAL)
# — garmd accepts both, and the bare form is what a human writes here.
roles:
  support-desk:
    # get_customer's masked shape, get_balance and get_payment_status: the
    # `support` set at the first-line ceiling. NOT list_cards — that tool is in
    # the `support` set too, but it is compartmented `card-data` and this role
    # does not hold it. A set narrows; it never grants. card-support below is
    # the role that holds card-data.
    #
    # `internet` and `research` are the adopted web.v1.fetch_page tool, from
    # github.com/garm-ai/tools (proto/web, proto/tools). A first-line desk
    # may read a public page — the published fee schedule, a regulator's
    # page — and this is the role the research-assistant agent folds
    # against. Every other agent holding this role (the assistant, the
    # guardian) gains the same names in its ceiling and reaches nothing new:
    # neither lists fetch_page, and the runner shows a model the allowlist,
    # not the claim. Which hosts a fetch may reach is not here at all — the
    # fetch service's allowlist decides per deployment and the agent's guard
    # per manifest.
    clearance: INTERNAL
    compartments: [pii-contact, financial, internet]
    verbs: [READ]
    tool_sets: [support, research]

  card-support:
    # freeze_card / unfreeze_card. WRITE, not DESTRUCTIVE — cards.proto's
    # linter refused DESTRUCTIVE here because a freeze is undone by the next
    # call, and this role's verb ceiling has to agree with that grading.
    clearance: CONFIDENTIAL
    compartments: [card-data]
    verbs: [READ, WRITE]
    tool_sets: [support]

  fraud-analyst:
    # The unmasked get_customer shape: full email, full phone, full date of
    # birth, the national identifier.
    #
    # Both sets, deliberately. An investigation starts from what first-line
    # already saw (get_balance, get_payment_status, get_customer) and follows
    # it into the compliance catalogue, and get_customer is annotated
    # `sets: ["support", "compliance"]` precisely because it is reached from
    # both. Naming only `compliance` would cut this role off from the balance
    # and payment-status tools, which are in `support` and `payments`; naming
    # nothing at all would not be "unscoped to first-line" but scoped to
    # EVERYTHING, `payments` included, which is the opposite of what an
    # analyst should hold.
    #
    # What stops the breadth from mattering is the compartments, which is
    # screening.proto's point that clearance and compartments are different
    # questions: this role sits one grade below RESTRICTED yet reaches
    # pii-identity, which no amount of seniority alone would grant — and it
    # holds neither kyc nor card-data, so screen_party and the card tools stay
    # closed to it however many sets it names.
    clearance: CONFIDENTIAL
    compartments: [financial, pii-contact, pii-identity]
    verbs: [READ]
    tool_sets: [support, compliance]

  compliance-officer:
    # screen_party and the sanctions/PEP result. kyc is its own compartment,
    # deliberately reachable by nobody above without it — and `compliance` is
    # the set screening.proto annotates screen_party into, so this role names
    # it. Both halves are load-bearing and neither substitutes for the other:
    # the set decides which tools a session sees, the compartment decides
    # whether the data inside them comes back.
    clearance: CONFIDENTIAL
    compartments: [kyc]
    verbs: [READ]
    tool_sets: [compliance]

  compliance-contact:
    # get_customer's masked shape, reached from the compliance catalogue.
    # get_customer is compartmented pii-contact and annotated into both the
    # support and compliance sets; compliance-officer holds neither the
    # compartment nor, deliberately, anything outside kyc. This is the
    # smallest bundle that lets a compliance session confirm WHICH customer a
    # screening is about — INTERNAL, one compartment, READ, and only the set
    # it already works in. It exists for the compliance-screen agent, and
    # priya holds it too, because the fold intersects: an agent that could
    # identify a customer for an officer who could not would reach further
    # than the human it acts for.
    clearance: INTERNAL
    compartments: [pii-contact]
    verbs: [READ]
    tool_sets: [compliance]

  payments-ops:
    # initiate_payment (DESTRUCTIVE, RESTRICTED, gated on a human grant
    # upstream of this policy) and get_payment_status (READ).
    #
    # Scoped to `payments`, which is the separation working in the direction
    # this file controls. The other direction — a support session not reaching
    # initiate_payment — is already settled by payments.proto annotating that
    # tool `sets: ["payments"]` and nothing else; it holds no matter what any
    # role here says, so claiming it as this role's doing would be claiming
    # credit for the catalogue's work. What naming `payments` here decides is
    # the reverse: a payments-ops session is confined to the payments
    # catalogue and does not also get handed the first-line support tools.
    # Omitting the field would not express "not in support" — it would leave
    # the role in every set, support included.
    clearance: RESTRICTED
    compartments: [financial]
    verbs: [READ, DESTRUCTIVE]
    tool_sets: [payments]

  task-triage:
    # The seven tools of `garm.tasks.v1` that carry `sets: ["triage"]`:
    # list_tasks, get_task, claim_task, release_task, triage_task, and — since
    # contracts v0.5.0 — decide_task and approval_card. Held by sam and priya,
    # and by no agent.
    #
    # A ROLE OF ITS OWN rather than `triage` added to payments-ops and
    # compliance-officer, and the reason is the fold. Those two roles are also
    # the ceilings of the support-assistant and compliance-screen agents
    # (`agents:` below), so widening them would widen what those agents may
    # reach — a change to two agents' authority made as a side effect of giving
    # two people a queue. This grants exactly the queue, to exactly the two.
    #
    # PUBLIC because every method of that contract is CLEARANCE_PUBLIC; the
    # queue's own predicate, not this clearance, is what decides which rows a
    # viewer sees. WRITE because claiming, releasing and triaging are writes,
    # and holding it here rather than in payments-ops keeps sam's payments
    # session at READ and DESTRUCTIVE, which is what it was.
    #
    # IT IS NOW SUFFICIENT FOR decide_task, AND IT WAS NOT WHEN IT WAS WRITTEN.
    # decide_task and approval_card declared no `sets` at contracts v0.3.0, and
    # garmd's `inScope` refuses a scoped caller a tool in no set — a role naming
    # any set reaches only tools sharing one — so this role bought sam and priya
    # a queue they could look at and decide nothing on, and the only role here
    # that reached the decision was retail-customer, which names no sets at all.
    # contracts v0.5.0 put both methods in `triage`, this tree requires v0.5.0,
    # and sam and priya reach both. Verified on the plane: DecideTask as sam gets
    # as far as request validation, and as jdoe it is still garmd's not_found.
    #
    # create_task remains set-less and therefore unscoped-only, which is right:
    # it is AUDIENCE_RUNNER, a tool the runner calls and a person does not.
    clearance: PUBLIC
    compartments: []
    verbs: [READ, WRITE]
    tool_sets: [triage]

  retail-customer:
    # Deliberately no tool_sets: this catalogue declares no self-service set
    # yet, so a customer's own token reaches whatever it exposes at this
    # ceiling rather than a narrower slice. Confining a customer to their OWN
    # accounts (never another customer's) is `account.can_read` in model.fga
    # — a per-record relation this policy cannot express and does not try to.
    # Minting this role for `kind: customer` before that relation is enforced
    # is a real clearance window, not a hypothetical one: see auth/README.md.
    clearance: INTERNAL
    compartments: [financial, pii-contact]
    verbs: [READ]

# Which segment grants which roles. Membership itself comes from OpenFGA.
# A principal holding roles from more than one segment gets the UNION: the
# highest clearance among them, and the union of compartments and verbs.
segments:
  support-staff:   { kind: employee, roles: [support-desk, card-support] }
  fraud-team:      { kind: employee, roles: [fraud-analyst] }
  compliance-team: { kind: employee, roles: [compliance-officer, compliance-contact] }
  payments-team:   { kind: employee, roles: [payments-ops] }
  retail:          { kind: customer, roles: [retail-customer] }

# An agent's own authority. The fold turns it into a ceiling automatically —
# delegation intersects, but that narrowing happens in the verifying daemon,
# never here.
agents:
  # Two roles, because the assistant reaches two catalogues. support-desk is
  # the first-line shape it uses for get_customer; payments-ops is what makes
  # initiate_payment visible at all — RESTRICTED, `financial`, DESTRUCTIVE and
  # the `payments` set, every one of which the tool requires.
  #
  # This is the ceiling and not a grant. The fold takes the minimum of this and
  # whoever the run acts for, so an assistant acting for a first-line agent who
  # holds none of it reaches none of it; what this block decides is only that
  # the AGENT is not the reason the payment is unreachable. Removing
  # payments-ops here makes the payment invisible to every run, whoever asked.
  #
  # It must stay at least as wide as support_assistant.proto's `principal`
  # block, or lint rule A3 and this file disagree about what the agent is.
  support-assistant: { roles: [support-desk, payments-ops] }

  # The card guardian: get_customer, list_cards and freeze_card. card-support
  # is what makes the card tools visible — CONFIDENTIAL, card-data, WRITE —
  # and support-desk is the first-line shape for get_customer. The union
  # carries `financial` too, which card_guardian.proto's principal does not
  # request: it changes nothing reachable, because the allowlist names no
  # financial tool and the runner shows the model the allowlist, not the
  # claim. NOT unfreeze_card, and not because of this block — the agent's
  # proto does not list it, and an allowlist is a wall where a prompt is
  # advice.
  card-guardian: { roles: [support-desk, card-support] }

  # The concierge: the customer's own ceiling and nothing above it. One role,
  # the one the customer holds, so the fold against a customer's token is
  # the identity — the agent brings nothing to the delegation the customer
  # did not already have. No tool_sets, like the role: a customer's session
  # is unscoped, and concierge.proto's door declares no sets for the same
  # reason.
  concierge: { roles: [retail-customer] }

  # The compliance screen: screen_party and get_customer. compliance-officer
  # is kyc at CONFIDENTIAL in the compliance set; compliance-contact adds
  # the pii-contact get_customer needs, and nothing else. Exactly
  # compliance_screen.proto's principal.
  compliance-screen: { roles: [compliance-officer, compliance-contact] }

  # The research assistant: fetch_page and get_customer. One role, the
  # first-line one, now that it carries `internet` and `research`. The union
  # carries `financial` too, which research_assistant.proto's principal does
  # not request: nothing reachable changes, because the allowlist names no
  # financial tool. What the agent may READ from the web is decided by the
  # fetch service's allowlist and the manifest's guard, never by this file.
  research-assistant: { roles: [support-desk] }

  # The new-beneficiary payment: the bank's one WORKFLOW agent, and the only
  # entry here that needs THREE roles. It is the union of what its four steps
  # require and NO NEW ROLE WAS ADDED FOR IT, which is worth saying plainly
  # because adding one was the obvious move: payments-ops is RESTRICTED,
  # `financial`, DESTRUCTIVE and the `payments` set, which initiate_payment
  # needs; compliance-officer is `kyc` in the `compliance` set, which
  # screen_party needs; compliance-contact is the `pii-contact` get_customer
  # needs. The union is exactly new_beneficiary_payment.proto's `principal`
  # block, and it has to stay that way or lint rule A3 and this file disagree
  # about what the agent is.
  #
  # IT IS THE SAME THREE ROLES AS compliance-screen PLUS payments-ops, which is
  # the structure of the graph showing through the policy: this agent invokes
  # that one as a step, so it must be able to reach everything that agent
  # reaches, and then pay.
  #
  # AND THE FOLD IS WHY NO EXISTING PERSON COULD RUN IT. Delegation intersects,
  # so a run reaches the minimum of this block and whoever it acts for — and
  # before this change nobody held both halves: jdoe and sam hold payments-ops
  # and no `kyc`, priya holds `kyc` and nothing financial. That separation was
  # deliberate (screening.proto: seniority is not need-to-know), so the answer
  # is a persona who holds both by assignment rather than a widening of
  # somebody who should not. personas.yaml adds `nadia` and tuples.yaml puts
  # her in both segments; see the note there.
  new-beneficiary-payment: { roles: [payments-ops, compliance-officer, compliance-contact] }
