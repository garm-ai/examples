// The agent manifest, declared on a proto service beside the tools it uses.
//
// A new package rather than a field on garm.tool.v1, because garmd must stay
// agent-blind: it sees Invoke and GetRun as two governed tools and never
// parses anything here. The extension number is outside the 50001-50005 block
// garm.tool.v1 owns, so the two vocabularies can never collide.
syntax = "proto3";
package garm.agent.v1;
option go_package = "github.com/garm-ai/contracts/garm/agent/v1;agentv1";

import "google/protobuf/any.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "garm/tool/v1/tool.proto";

extend google.protobuf.ServiceOptions { AgentPolicy agent = 50101; }

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_REACT       = 1;
  MODE_WORKFLOW    = 2;
}

// One step of a workflow graph: a governed tool call. There is no other kind.
// A model call is an agent invocation, because an agent is a tool; a suspension
// is a grant-mode tool step, because garmd already answers "waiting".
message Step {
  string id   = 1;                 // unique within the graph
  string tool = 2;                 // FQN; must appear in AgentPolicy.tools
  // Field path on the tool's REQUEST message -> a CEL expression over `state`.
  // A static input is a CEL literal. May not name a runner-owned control field.
  map<string, string> with = 3;
  // Field path on the STATE -> a CEL expression over `state` and `response`.
  map<string, string> set = 4;
}

// A directed edge. `when` empty means unconditional; A6 requires that a step
// with any outgoing edge has at least one of those, so "no predicate matched"
// cannot arise.
message Edge {
  string from = 1;
  string to   = 2;
  string when = 3;
}

// A deliberate downgrade, on a field of a state message. Without it a state
// field inherits the clearance and compartments of what it is written from
// (A11).
message DerivedValue {
  string from   = 1;   // the message or field the value is derived from
  string reason = 2;   // why the derived value is less sensitive
}

extend google.protobuf.FieldOptions { DerivedValue derives = 50102; }

message Principal {
  garm.tool.v1.Clearance clearance = 1;
  repeated string compartments = 2;
}
message Model  { string alias = 1; }
message Bounds {
  uint32 max_steps = 1;
  uint64 max_tokens = 2;
  uint32 max_tool_calls = 3;
  google.protobuf.Duration timeout = 4;   // active time, spec §4.1
}
message Prompt     { string path = 1; string sha256 = 2; }   // sha256 is lowercase hex, no prefix
message ToolRef    { string fqn = 1; string guard = 2; }     // fqn = "<proto package>.<tool name>"
message OutputRule { string expr = 1; string message = 2; }

message AgentPolicy {
  Mode mode = 1;
  Principal principal = 2;
  Model model = 3;
  Bounds bounds = 4;
  map<string, Prompt> prompts = 5;        // key "system" is required
  repeated ToolRef tools = 6;
  repeated OutputRule output_rules = 7;   // parsed by lint, not evaluated in the MVP
  repeated Step steps           = 8;
  repeated Edge edges           = 9;
  // State field path -> a CEL expression over `input`. The ONLY place a
  // caller's request enters the state; every step reads `state`.
  map<string, string> initial   = 10;
}

// Shared by every agent's Invoke and GetRun (spec §2.1). Fields are PUBLIC because
// a caller who can see Invoke at all (A5) is the only caller who can reach them, and
// GetRun additionally refuses runs the caller did not start (spec §4.5, §3.5 there).
//
// The scalars are `optional` because these messages are a governed tool's
// request and response, so garm's own L6 walks them: omit on a singular scalar
// with no presence makes "redacted" and "empty" indistinguishable on the wire,
// and the rule refuses it. Presence costs nothing here and the field numbers,
// wire shape and generated getters are the same either way.
message RunRef {
  option (garm.tool.v1.default_field_policy) = { read: CLEARANCE_PUBLIC on_deny: { omit: {} } };
  optional string run_id = 1;
}
enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_RUNNING = 1;
  RUN_STATE_WAITING_APPROVAL = 2;
  RUN_STATE_COMPLETED = 3;
  RUN_STATE_FAILED = 4;
}
message RunStatus {
  option (garm.tool.v1.default_field_policy) = { read: CLEARANCE_PUBLIC on_deny: { omit: {} } };
  optional string run_id = 1;
  optional RunState state = 2;
  google.protobuf.Any result = 3;         // the agent's declared output message
  optional string error = 4;              // scrubbed, static text; never provider or tool error text
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
}
