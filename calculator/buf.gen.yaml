version: v2
inputs:
  - directory: proto
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt: paths=source_relative
    include_imports: false
  # The tool-side binding: the Handler interface an author implements and the
  # Serve that registers it. emit=toolsdk is the consumer half; emit=server is
  # garm's own wiring and belongs nowhere near a tool service.
  #
  # No connect plugin, and the binding is colocated rather than in a sibling
  # package. Both used to be required because the binding emitted an AsConnect
  # adapter, which referenced the connect handler in this package's connect
  # sibling, which imported this package back for message types. The adapter is
  # opt-in now (connect_adapter=true), and this calculator is reached over NATS
  # by a daemon that never speaks connect to it.
  - local: protoc-gen-garm-go
    out: gen
    opt: paths=source_relative,emit=toolsdk,contract_version=v0.1.0
