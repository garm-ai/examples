name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with: { install: true, cache: true }
      # The same list as `mise run ci`, one step each so a red build names
      # the gate that failed rather than the task that wraps them all.
      - run: mise run lint
      - run: mise run lint-bank
      - run: mise run build
      - run: mise run test
      # Generated code is committed, so it can go stale. This is what stops
      # a .proto change from shipping without the binding that matches it.
      - run: mise run gen-check
      # A prompt is committed too, and its sha256 is pinned in the agent's
      # annotation. An edited prompt with a stale pin is a runner that refuses
      # the agent at deploy time; this makes it a red build instead.
      - run: mise run prompt-sha-check
      # Every compartment and tool set the bank's claims policies name must be
      # one the catalogue actually declares — a name it does not is dropped
      # silently at verify time, never rejected. The task builds the catalogue
      # itself rather than trusting bank.binpb on disk, which is gitignored
      # and generated, so a stale copy can never pass this.
      #
      # In the `ci` job rather than its own now that the CLI it needs is
      # tagged: it had a job of its own only while `garm claims check` existed
      # in no release, when its failure would have turned every unrelated pull
      # request red. It now depends on the same pinned `cli` task (v0.15.0)
      # that the test step installs.
      - name: auth/claims.yaml and auth/personas.yaml against a freshly built bank catalogue
        run: mise run claims-check-bank
      # Both directions of the mount refusal, and the two failing runs are the
      # point. See mise.toml.
      - run: mise run check-bank

  # What does merging this change about who may see what?
  #
  # The annotations ARE the policy, so a clearance edit arrives as an ordinary
  # proto diff and a domain owner reviewing it is not a security reviewer. This
  # puts the answer in the pull request, where somebody has to scroll past it.
  #
  # Pull requests only: the question is about a change, and there is nothing to
  # compare a push to main against.
  policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The base ref has to be fetched — the default checkout is a shallow
      # single commit, and a diff needs both sides.
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@v2
        with: { install: true, cache: true }
      - name: how this branch moves the bank's policy
        env:
          BASE: origin/${{ github.base_ref }}
        run: mise run diff-bank

  # This repository IS the acceptance test for the split. If it builds
  # against published artifacts with no shortcut, the boundaries are real;
  # if it needs one, they are not, and the shortcut is the bug.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with: { install: true, cache: true }

      - name: no replace directives
        run: |
          if grep -q '^replace\|^\s*replace ' go.mod; then
            echo "::error::a replace directive means this is not building against published artifacts" >&2
            grep replace go.mod >&2
            exit 1
          fi
          echo "clean: published artifacts only"

      - name: no path to the daemon
        run: |
          if go list -deps ./... 2>/dev/null | grep -E 'garm-ai/garmd'; then
            echo "::error::a tool service reached the daemon; it must not be able to enforce" >&2
            exit 1
          fi
          echo "clean: no path to garmd"
